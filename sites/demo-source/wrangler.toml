name = "jant-demo-source"
main = "index.js"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
account_id = "03e7294bdb3750ed5a0d6afef6d770e4"

[assets]
directory = "./node_modules/@jant/core/dist/client"

[dev]
port = 9030

[vars]
SITE_ORIGIN = "https://demo-source.jant.me"
# demo-source holds the same posts demo.jant.me publishes, and it answers
# anonymous requests — "private" describes who edits it, not who can read it.
# Left crawlable, the official demo content is indexed twice, and the copy that
# ranks is the one that is not meant to be the public face. demo.jant.me gets
# noindex from DEMO_MODE; this site has to ask for it. Setting it here also
# flips robots.txt to `Disallow: /`.
#
# NOINDEX resolves DB > env, so toggling it off in Settings would win over this.
NOINDEX = "true"
R2_PUBLIC_URL = "https://demo-source-media.jant.me"
IMAGE_TRANSFORM_URL = "https://demo-source-media.jant.me/cdn-cgi/image"

[[d1_databases]]
binding = "DB"
database_name = "jant-demo-source-db"
database_id = "16363340-4c94-4415-9638-c532cd41c747"
migrations_dir = "node_modules/@jant/core/src/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "demo-source-media"
remote = true
