# Deploy your Jant site to Cloudflare Workers on every push to main.
#
# Prerequisites:
# 1. Run `npm run deploy` once on your computer. The first deploy creates the
#    D1 database, the R2 bucket, and AUTH_SECRET, and writes the database ID
#    to wrangler.toml. Commit wrangler.toml.
# 2. Add repository secrets: CF_API_TOKEN, CF_ACCOUNT_ID
#
# Full setup guide: https://jant.me/docs/deployment#automatic-deploys-via-github-actions

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deploy prerequisites
        id: preflight
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu

          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "Add \`CF_API_TOKEN\` and \`CF_ACCOUNT_ID\` in GitHub Actions secrets to enable auto-deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          database_id="$(sed -n 's/^database_id = "\([^"]*\)".*/\1/p' wrangler.toml | head -n 1)"

          if [ -z "${database_id}" ] || [ "${database_id}" = "local" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "\`wrangler.toml\` still has the placeholder D1 \`database_id\`. Run \`npm run deploy\` once on your computer, then commit \`wrangler.toml\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      # `jant deploy` applies remote migrations and data backfills, then
      # uploads the Worker with the static assets SITE_PATH_PREFIX needs.
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        run: npx jant deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
