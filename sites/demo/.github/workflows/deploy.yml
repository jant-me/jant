# Deploy your Jant site to Cloudflare Workers on every push to main.
#
# Prerequisites:
# 1. Run `npm run deploy` once on your computer. The first deploy creates the
#    D1 database, the R2 bucket, and AUTH_SECRET, and writes the database ID
#    to wrangler.toml. Commit wrangler.toml.
# 2. Add repository secrets: CF_API_TOKEN, CF_ACCOUNT_ID
#
# Without the secrets, `jant deploy --ci` skips the deploy without failing.
# The checks and the deploy itself come from the @jant/core version in your
# lockfile, so they stay current as you upgrade.
#
# Full setup guide: https://jant.me/docs/deployment#automatic-deploys-via-github-actions

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npx jant deploy --ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
