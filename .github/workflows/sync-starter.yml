# Sync processed template to jant-me/jant-starter for the "Deploy to Cloudflare" button.
# Uses create-jant CLI to scaffold the project (same processing as end users get).

name: Sync Starter

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  sync:
    name: Sync Starter Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `npm publish` returns before the registry serves the new version, and a
      # large package can lag by minutes: @jant/core 0.7.0 appeared 11 minutes
      # after changesets reported it published, and the starter's `npm install`
      # failed with ETARGET in between. Poll the abbreviated packument with the
      # Accept header npm install sends, so this waits on the document the
      # install reads.
      - name: Wait for npm to serve this @jant/core
        id: core
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('packages/core/package.json','utf-8')).version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Accept: application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*' \
              https://registry.npmjs.org/@jant%2fcore | jq -e --arg v "$version" '.versions[$v]' > /dev/null; then
              echo "npm serves @jant/core@${version}"
              exit 0
            fi
            echo "npm does not serve @jant/core@${version} yet (attempt ${attempt}/60), retrying in 30s"
            sleep 30
          done
          echo "npm still does not serve @jant/core@${version} after 30 minutes" >&2
          exit 1

      - name: Generate and push starter
        run: |
          # Prepare create-jant CLI (copy template, merge tsconfig, build, inject version)
          pnpm --filter create-jant prepublishOnly

          # Scaffold starter project using create-jant (reuses all processing logic)
          cd /tmp
          npm_config_user_agent="npm/10.0.0" node "$GITHUB_WORKSPACE/packages/create-jant/dist/index.js" my-site -y --no-install --no-git

          # Remove generated .dev.vars (starter should only have .dev.vars.example)
          rm -f /tmp/my-site/.dev.vars

          # Generate package-lock.json so the deploy workflow can use npm ci
          cd /tmp/my-site
          npm install

          # Clone jant-starter
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/jant-me/jant-starter.git" /tmp/jant-starter
          cd /tmp/jant-starter

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove all tracked files (keep .git)
          git rm -rf . 2>/dev/null || true

          # Copy scaffolded project
          cp -r /tmp/my-site/. .

          # Stage everything
          git add -A

          # Commit and push (only if there are changes)
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync with jant v${VERSION}"
            git push
            echo "Synced starter template to v${VERSION}"
          fi
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          VERSION: ${{ steps.core.outputs.version }}
