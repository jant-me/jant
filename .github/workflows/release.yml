name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      core_published: ${{ steps.release-meta.outputs.core_published }}
      release_version: ${{ steps.release-meta.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: mise run build-packages

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: mise run release-version
          publish: mise run release-publish
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uses trusted publishing via OIDC (id-token: write permission)

      - name: Derive release metadata
        if: steps.changesets.outputs.published == 'true'
        id: release-meta
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const packages = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
          const core = packages.find((pkg) => pkg.name === "@jant/core");
          const version = core?.version ?? packages[0]?.version ?? "";

          console.log(`core_published=${core ? "true" : "false"}`);
          console.log(`version=${version}`);
          EOF

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release-meta.outputs.version }}
          name: v${{ steps.release-meta.outputs.version }}
          body: |
            ## Published Packages

            ${{ join(fromJson(steps.changesets.outputs.publishedPackages).*.name, ', ') }}

            See [CHANGELOG](https://github.com/jant-me/jant/blob/main/packages/core/CHANGELOG.md) for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Debug output (can remove later)
      - name: Debug changesets output
        if: always()
        run: |
          echo "published: ${{ steps.changesets.outputs.published }}"
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}"

  sync-starter:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/sync-starter.yml
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  docker-publish:
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.core_published == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.release_version }}
      push_latest: true
    secrets: inherit
