name: Docker Publish

on:
  workflow_call:
    inputs:
      version:
        description: Docker image version tag without a leading v
        required: false
        type: string
      push_latest:
        description: Also update the latest tag
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Docker image version tag without a leading v (defaults to packages/core/package.json on main)
        required: false
        type: string
      push_latest:
        description: Also update the latest tag
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$(node -p "JSON.parse(require('fs').readFileSync('./packages/core/package.json', 'utf8')).version")"
          fi

          version="${version#v}"
          if [[ -z "$version" ]]; then
            echo "Docker image version is required." >&2
            exit 1
          fi

          tags="owenyoung/jant:${version}"
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            tags="${tags}"$'\n'"owenyoung/jant:latest"
            # From 1.0, `:<major>` follows the newest release of that major, so
            # a compose file pinned to `:1` never pulls across a breaking release.
            # 0.x has no such tag: its minor releases can break.
            major="${version%%.*}"
            if [[ "$version" != *-* && "$major" =~ ^[0-9]+$ && "$major" -ge 1 ]]; then
              tags="${tags}"$'\n'"owenyoung/jant:${major}"
            fi
          fi

          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: owenyoung
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Jant
            org.opencontainers.image.description=Single-author microblogging platform
            org.opencontainers.image.source=https://github.com/jant-me/jant
            org.opencontainers.image.url=https://github.com/jant-me/jant
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae # v4.0.0
        with:
          username: owenyoung
          # Editing the repository description requires account-level credentials;
          # DOCKERHUB_TOKEN (a PAT with Read & Write) gets 403 on this PATCH endpoint.
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: owenyoung/jant
          short-description: Single-author microblogging for self-hosted Docker and Cloudflare.
          readme-filepath: ./docs/docker-hub-overview.md
