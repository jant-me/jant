name: Deploy Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    # demo.jant.me is the Docker demo (reset-demo-studio.yml); this is the
    # Workers build of sites/demo, kept deployed on its own.
    name: Deploy the jant-demo Worker
    uses: ./.github/workflows/deploy.yml
    with:
      working_directory: sites/demo
      github_environment: demo
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
