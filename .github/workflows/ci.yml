name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/preview' }}

jobs:
  changes:
    name: Detect Deploy Targets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.filter.outputs.demo }}
      demo_source: ${{ steps.filter.outputs.demo_source }}
      content_lab: ${{ steps.filter.outputs.content_lab }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed deploy targets
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t changed_files < <(git ls-tree -r --name-only "$AFTER_SHA")
          else
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          fi

          echo "Changed files:"
          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "  (none)"
          else
            printf '  %s\n' "${changed_files[@]}"
          fi

          demo=false
          demo_source=false
          content_lab=false

          for file in "${changed_files[@]}"; do
            case "$file" in
              packages/core/*|sites/demo/*|.github/workflows/deploy.yml|.github/workflows/deploy-demo.yml)
                demo=true
                ;;
            esac

            case "$file" in
              packages/core/*|sites/demo-source/*|.github/workflows/deploy.yml|.github/workflows/deploy-demo-source.yml)
                demo_source=true
                ;;
            esac

            case "$file" in
              packages/core/*|sites/content-lab/*|.github/workflows/deploy.yml|.github/workflows/deploy-content-lab.yml)
                content_lab=true
                ;;
            esac
          done

          {
            echo "demo=$demo"
            echo "demo_source=$demo_source"
            echo "content_lab=$content_lab"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all checks
        run: mise run check-ci

  pg-smoke:
    name: PG Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Postgres smoke test
        env:
          PG_SMOKE_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jant_pg_smoke
        run: mise run check-pg-smoke

      - name: Rehearse Postgres migrations on seeded data
        env:
          PG_REHEARSAL_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jant_pg_rehearsal
        run: mise run check-pg-rehearsal

  deploy-demo:
    name: Deploy Demo
    needs: [changes, ci, pg-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.demo == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      working_directory: sites/demo
      github_environment: demo
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-demo-source:
    name: Deploy demo-source
    needs: [changes, ci, pg-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.demo_source == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      working_directory: sites/demo-source
      github_environment: demo-source
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-content-lab:
    name: Deploy content-lab
    needs: [changes, ci, pg-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.content_lab == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      working_directory: sites/content-lab
      github_environment: content-lab
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-studio-prod:
    name: Deploy Jant via Build
    needs: [ci, pg-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-studio.yml
    with:
      source_ref: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      target_env: prod
      github_environment: jant-prod
    secrets:
      BUILD_REPO_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}

  deploy-studio-preview:
    name: Deploy Jant Preview via Build
    needs: [ci, pg-smoke]
    # Pushes to the preview branch deploy directly; PR-based preview deploys
    # skip the preview branch itself so one push never dispatches twice.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/preview') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != 'preview')
    uses: ./.github/workflows/deploy-studio.yml
    with:
      source_ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      target_env: preview
      github_environment: jant-preview
    secrets:
      BUILD_REPO_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}

  deploy-summary:
    name: Deployment Summary
    needs:
      - changes
      - ci
      - pg-smoke
      - deploy-demo
      - deploy-demo-source
      - deploy-content-lab
      - deploy-studio-prod
      - deploy-studio-preview
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write deployment summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          CI_RESULT: ${{ needs.ci.result }}
          PG_SMOKE_RESULT: ${{ needs['pg-smoke'].result }}
          DEMO_SELECTED: ${{ needs.changes.outputs.demo || 'false' }}
          DEMO_SOURCE_SELECTED: ${{ needs.changes.outputs.demo_source || 'false' }}
          CONTENT_LAB_SELECTED: ${{ needs.changes.outputs.content_lab || 'false' }}
          DEPLOY_DEMO_RESULT: ${{ needs['deploy-demo'].result }}
          DEPLOY_DEMO_SOURCE_RESULT: ${{ needs['deploy-demo-source'].result }}
          DEPLOY_CONTENT_LAB_RESULT: ${{ needs['deploy-content-lab'].result }}
          DEPLOY_STUDIO_PROD_RESULT: ${{ needs['deploy-studio-prod'].result }}
          DEPLOY_STUDIO_PREVIEW_RESULT: ${{ needs['deploy-studio-preview'].result }}
        run: |
          set -euo pipefail

          write_row() {
            printf '| %s | %s | %s |\n' "$1" "$2" "$3"
          }

          {
            echo "## Deployment Summary"
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Ref: \`$REF_NAME\`"
            echo "- CI: \`$CI_RESULT\`"
            echo "- PG Smoke: \`$PG_SMOKE_RESULT\`"
            echo
            echo "| Target | Selected | Result |"
            echo "| --- | --- | --- |"

            if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
              write_row "demo.jant.me" "${DEMO_SELECTED:-false}" "$DEPLOY_DEMO_RESULT"
              write_row "demo-source.jant.me" "${DEMO_SOURCE_SELECTED:-false}" "$DEPLOY_DEMO_SOURCE_RESULT"
              write_row "content-lab.jant.me" "${CONTENT_LAB_SELECTED:-false}" "$DEPLOY_CONTENT_LAB_RESULT"
              write_row "jant prod build" "true" "$DEPLOY_STUDIO_PROD_RESULT"
            elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "preview" ]; then
              write_row "jant preview build" "true" "$DEPLOY_STUDIO_PREVIEW_RESULT"
            elif [ "$EVENT_NAME" = "pull_request" ]; then
              if [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
                write_row "jant preview build" "no (fork PR)" "$DEPLOY_STUDIO_PREVIEW_RESULT"
              elif [ "$PR_HEAD_REF" = "preview" ]; then
                write_row "jant preview build" "no (deploys on push to preview)" "$DEPLOY_STUDIO_PREVIEW_RESULT"
              else
                write_row "jant preview build" "true" "$DEPLOY_STUDIO_PREVIEW_RESULT"
              fi
            else
              write_row "automatic deploys" "n/a" "not selected for this event"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
