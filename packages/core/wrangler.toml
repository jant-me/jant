# Dev entry point for @cloudflare/vite-plugin HMR.
# Production builds use src/index.ts via vite.config.worker.ts.
name = "jant-dev"
main = "dev/entry.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
account_id = "03e7294bdb3750ed5a0d6afef6d770e4"
[dev]
port = 3000

[vars]
# PAGE_SIZE = 25
# SITE_ORIGIN = "https://jant.localtest.me"
# R2_PUBLIC_URL = "https://demo-media.jant.me"
# IMAGE_TRANSFORM_URL = "https://demo-media.jant.me/cdn-cgi/image"


[[d1_databases]]
binding = "DB"
database_name = "jant-dev-db"
database_id = "local"
migrations_dir = "src/db/migrations"


[[r2_buckets]]
binding = "R2"
bucket_name = "jant-demo-media"
remote = false

# ============================================
# Preview environment (deploy current branch)
# Usage: wrangler deploy --env preview
# ============================================
[env.preview]
name = "jant-preview"
main = "dev/preview-entry.js"

[env.preview.assets]
directory = "dist/client"

[env.preview.vars]
SITE_ORIGIN = "https://preview.jant.me"
SITE_PATH_PREFIX = "/blog"
PAGE_SIZE = 25

[[env.preview.d1_databases]]
binding = "DB"
database_name = "jant-preview-db"
database_id = "c1aed962-7394-4d1a-aea0-5de5e09d40dd"
migrations_dir = "src/db/migrations"

[[env.preview.r2_buckets]]
binding = "R2"
bucket_name = "jant-preview-media"
