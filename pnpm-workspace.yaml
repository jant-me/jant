packages:
  - "packages/*"
  - "sites/*"

# Refuse to run a script against a `node_modules` that lags `pnpm-lock.yaml`.
# Each git worktree carries its own `node_modules`, and nothing reinstalls it
# when a merge moves the lockfile — so a worktree can sit on a dependency
# version the code no longer targets. That does not fail loudly: Vite strips
# types without checking them, so a call to an API the installed version does
# not have reaches the browser and throws at runtime, where a `catch` may well
# swallow it. Verified against the real shape of the mistake — replacing
# `package.json` + `pnpm-lock.yaml` under an installed `node_modules` now
# fails the next `pnpm run` with ERR_PNPM_VERIFY_DEPS_BEFORE_RUN.
verifyDepsBeforeRun: error

catalog:
  "@types/node": ^25.5.0
  typescript: ^6.0.2
  wrangler: ^4.76.0

onlyBuiltDependencies:
  - better-sqlite3
  - cn-font-split
  - sharp

# better-auth ships breaking changes in minor releases — 1.7.0 re-keyed
# accounts on a new required `issuer` column, which 1.7.3 then reverted — so
# core depends on it with `~` rather than `^`: a site installed from npm takes
# its patch releases and nothing further until core has been verified against
# the next minor.
overrides:
  # `@lingui/swc-plugin` is a Wasm plugin: the `swc_core` ABI it targets is
  # fixed when the plugin is compiled, so the host `@swc/core` has to match it
  # exactly. 1.16.2 does not — every transform fails with "Failed to
  # deserialize program received from host", which surfaces as an SSR module
  # evaluation error on the first request, not at install time.
  #
  # Pinning the direct dependency is not enough: `tsup` takes `@swc/core` as an
  # optional peer with an open range, and that resolution is what the plugin
  # binds against. A lockfile is not enough either — `mise run clean-reset`
  # deletes it by design, so a fresh install re-resolves every `^` to latest.
  # This override is the only thing that survives both.
  #
  # Raise it only together with a `@lingui/swc-plugin` release built for the
  # newer `swc_core`, and verify by actually requesting a page from
  # `mise run dev-node` — the error does not appear until a module is evaluated.
  "@swc/core": 1.15.47

  # pinyin-pro 3.29.1 schedules its Aho-Corasick build with setTimeout at
  # module scope, which Cloudflare Workers reject at deploy time ("Disallowed
  # operation called within global scope"). 3.29.0 builds it synchronously.
  # Reachable from limax -> slugify. Unpin once upstream stops scheduling at
  # import time: https://github.com/zh-lx/pinyin-pro/issues
  pinyin-pro: 3.29.0

  # Lifted past the releases `pnpm audit` reports. Each consumer pins an older
  # range and has no release on a fixed one yet; drop an entry once it does.
  #
  # sharp: miniflare, under @cloudflare/vite-plugin, pins 0.34. Local dev and
  #   the brand-asset scripts only; nothing ships it.
  # uuid: typeid-js asks for ^10. It calls v7, parse and stringify, none of
  #   which changed in 11; the advisory covers v3/v5/v6 with a caller's buffer.
  # esbuild under @esbuild-kit/core-utils: drizzle-kit's TypeScript loader,
  #   pinned to 0.18. Only `db-schema-generate` runs it.
  # esbuild under tsup: builds create-jant.
  sharp: ^0.35.5
  "typeid-js>uuid": ^11.1.1
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  "tsup>esbuild": ^0.28.1
