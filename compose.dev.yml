services:
  jant-migrate:
    image: ${DEV_IMAGE:-jant:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PORT: ${PORT:-3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    command: ["jant", "migrate"]
    restart: "no"
    profiles:
      - migrate

  jant:
    image: ${DEV_IMAGE:-jant:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PORT: ${PORT:-3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - ./data:/var/lib/jant
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
