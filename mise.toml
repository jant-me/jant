# =============================================================================
# Tools
# =============================================================================
[tools]
node = "lts"
pnpm = "10.28.2"

# =============================================================================
# CI
# =============================================================================
[tasks.ci]
alias = "check"
description = "Run all CI checks (lint + typecheck + test + build + i18n + template)"
run = """
mise run lint
mise run typecheck
mise run test
mise run build-all
mise run i18n-check
mise run test-template
"""

# =============================================================================
# Development (uses templates/jant-site)
# =============================================================================
[tasks.dev]
description = "Start development server"
run = "pnpm --filter jant-site dev"

[tasks.build-lib]
alias = "bl"
description = "Build @jant/core library for publishing"
run = "pnpm --filter @jant/core build:lib"

[tasks.dev-debug]
alias = "debug"
description = "Start dev server on port 19019 (for Claude debugging)"
run = "pnpm --filter jant-site dev:debug"

[tasks.build]
description = "Build template project"
run = "pnpm --filter jant-site build"

[tasks.build-types]
description = "Generate @jant/core type declarations"
run = "pnpm --filter @jant/core build:types"

[tasks.build-all]
description = "Build all publishable packages"
run = """
pnpm --filter @jant/core build
pnpm --filter jant-theme-card build
pnpm --filter jant-theme-minimal build
pnpm --filter jant-theme-threads build
pnpm --filter create-jant build
"""

[tasks.typecheck]
description = "Run TypeScript type checking (all packages)"
depends = ["build-types"]
run = "pnpm -r typecheck"

# =============================================================================
# Testing
# =============================================================================
[tasks.test]
alias = "t"
description = "Run all tests"
run = "pnpm --filter @jant/core test"

[tasks."test:watch"]
alias = "tw"
description = "Run tests in watch mode"
run = "pnpm --filter @jant/core test:watch"

[tasks."test:coverage"]
alias = "tc"
description = "Run tests with coverage report"
run = "pnpm --filter @jant/core test:coverage"

# =============================================================================
# Code Quality (uses @jant/core)
# =============================================================================
[tasks.lint]
description = "Run ESLint"
run = "pnpm lint"

[tasks.format]
description = "Format code with Prettier"
run = "prettier --write ."

[tasks.format-check]
description = "Check code formatting"
run = "prettier --check ."

# =============================================================================
# Database (D1)
# =============================================================================
[tasks.db-generate]
alias = "generate"
description = "Generate Drizzle migrations (from core schema)"
run = "pnpm --filter @jant/core db:generate"

[tasks.db-migrate]
alias = "migrate"
description = "Run D1 migrations (local template)"
run = "pnpm --filter jant-site db:migrate:local"

[tasks.db-migrate-remote]
description = "Run D1 migrations (remote template)"
run = "pnpm --filter jant-site db:migrate:remote"

[tasks.db-clean]
description = "Delete local D1 database (wrangler state)"
run = "rm -rf templates/jant-site/.wrangler"

[tasks.db-reset]
description = "Delete local database and re-run migrations"
run = """
rm -rf templates/jant-site/.wrangler
pnpm --filter jant-site db:migrate:local
"""

[tasks.db-export]
description = "Export current local D1 data to seed-local.sql"
dir = "templates/jant-site"
run = "node scripts/export-seed.mjs"

[tasks.db-seed]
alias = "seed"
description = "Reset local database and load dev seed data"
dir = "templates/jant-site"
run = """
echo "Resetting database..."
rm -rf .wrangler
echo "Running migrations..."
pnpm exec wrangler d1 migrations apply DB --local
echo "Clearing data..."
pnpm exec wrangler d1 execute DB --local --file=scripts/reset-local.sql
echo "Loading seed data..."
pnpm exec wrangler d1 execute DB --local --file=scripts/seed-local.sql
echo "Done! Database has been seeded."
"""

# =============================================================================
# i18n (Lingui)
# =============================================================================
[tasks.i18n]
description = "Extract, translate with AI, and compile (requires OPENAI_API_KEY)"
run = "mise run i18n-extract && mise run translate && mise run i18n-compile"

[tasks.i18n-no-translate]
description = "Extract and compile only (without translation)"
run = "pnpm --filter @jant/core i18n:build"

[tasks.i18n-check]
description = "Check i18n catalogs are in sync with source"
run = """
pnpm --filter @jant/core i18n:build
if ! git diff --exit-code packages/core/src/i18n/locales/; then
  echo ""
  echo "❌ i18n catalogs are out of sync!"
  echo "Run 'mise run i18n-no-translate' locally and commit the changes."
  exit 1
fi
"""

[tasks.i18n-extract]
alias = "extract"
description = "Extract messages from source"
run = "pnpm --filter @jant/core i18n:extract"

[tasks.i18n-compile]
alias = "compile"
description = "Compile PO files to JS"
run = "pnpm --filter @jant/core i18n:compile"

[tasks.translate]
description = "Translate all locales using AI (requires OPENAI_API_KEY)"
depends = ["translate-zh-Hans", "translate-zh-Hant"]

[tasks.translate-zh-Hans]
alias = "tz"
description = "Translate to Simplified Chinese"
run = """
npx lingui-po-translate \
  --srcFile=packages/core/src/i18n/locales/en.po \
  --srcLng=en \
  --srcFormat=po \
  --targetFile=packages/core/src/i18n/locales/zh-Hans.po \
  --targetLng=zh-Hans \
  --targetFormat=po \
  --service=openai \
  --serviceConfig="$OPENAI_API_KEY"
"""

[tasks.translate-zh-Hant]
alias = "tt"
description = "Translate to Traditional Chinese"
run = """
npx lingui-po-translate \
  --srcFile=packages/core/src/i18n/locales/en.po \
  --srcLng=en \
  --srcFormat=po \
  --targetFile=packages/core/src/i18n/locales/zh-Hant.po \
  --targetLng=zh-Hant \
  --targetFormat=po \
  --service=openai \
  --serviceConfig="$OPENAI_API_KEY" \
  --sourceOverride="zh-Hant:zh-Hans"
"""

[tasks.preview]
description = "Build and preview production locally"
depends = ["build"]
run = "pnpm --filter jant-site preview"

# =============================================================================
# Deploy
# =============================================================================
[tasks.deploy]
description = "Deploy template to Cloudflare Workers"
run = "pnpm --filter jant-site run deploy"

# =============================================================================
# Demo
# =============================================================================
[tasks.demo-deploy]
alias = "dd"
description = "Deploy demo site to demo.jant.me"
dir = "templates/jant-site"
run = """
echo "Running remote migrations..."
pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.demo.toml

echo "Building for demo environment..."
WRANGLER_CONFIG=./wrangler.demo.toml NODE_ENV=production pnpm exec vite build

echo "Deploying to Cloudflare Workers..."
pnpm exec wrangler deploy --config wrangler.demo.toml
"""

[tasks.demo-reset]
description = "Reset demo.jant.me data (clear + reseed)"
dir = "templates/jant-site"
run = "pnpm exec wrangler d1 execute DB --remote --config wrangler.demo.toml --file=scripts/seed-demo.sql"

[tasks.demo-export]
description = "Export demo database to scripts/seed-demo.sql"
dir = "templates/jant-site"
run = "node scripts/export-demo.mjs"

[tasks.demo-seed]
description = "Push local seed data to demo"
dir = "templates/jant-site"
run = """
echo "Exporting local data..."
node scripts/export-seed.mjs --no-auth --output seed-demo-upload.sql
echo "Loading seed data to demo (includes reset)..."
pnpm exec wrangler d1 execute DB --remote --config wrangler.demo.toml --file=scripts/seed-demo-upload.sql
rm scripts/seed-demo-upload.sql
echo "Done! Demo has been seeded from local data."
"""

# =============================================================================
# Official Site (sites/jant-me)
# =============================================================================
[tasks.site-dev]
alias = "sd"
description = "Start jant.me development server"
run = "pnpm --filter jant-me dev"

[tasks.site-build]
alias = "sb"
description = "Build jant.me for production"
run = "pnpm --filter jant-me build"

[tasks.site-deploy]
description = "Deploy jant.me to Cloudflare Workers"
run = "pnpm --filter jant-me run deploy"

# =============================================================================
# Utilities
# =============================================================================
[tasks.reset-password]
description = "Generate password reset token (local D1)"
dir = "templates/jant-site"
run = "node scripts/reset-password.mjs"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf packages/*/dist themes/*/dist packages/*/.wrangler templates/*/.wrangler examples/"

[tasks.nuke]
description = "Remove all node_modules and reinstall"
run = "rm -rf node_modules packages/*/node_modules templates/*/node_modules themes/*/node_modules examples/ && pnpm install"

[tasks.fresh]
alias = "reset"
description = "Nuclear reset - delete everything and start fresh (node_modules, dist, cache, db, lock file)"
run = """
echo "🧹 Nuclear reset - deleting everything..."
echo ""
echo "📦 Removing node_modules..."
rm -rf node_modules packages/*/node_modules templates/*/node_modules themes/*/node_modules

echo "🗑️  Removing build artifacts..."
rm -rf packages/*/dist themes/*/dist templates/*/dist packages/create-jant/template/dist

echo "💾 Removing local databases and Wrangler state..."
rm -rf packages/*/.wrangler templates/*/.wrangler packages/create-jant/template/.wrangler

echo "⚡ Removing Vite cache..."
rm -rf packages/*/.vite templates/*/.vite packages/create-jant/template/.vite

echo "🌐 Removing i18n build cache..."
rm -rf packages/*/.lingui-build

echo "🗂️  Removing generated examples..."
rm -rf examples/

echo "🔒 Removing lock file..."
rm -f pnpm-lock.yaml

echo ""
echo "✨ Everything deleted! Now reinstalling dependencies..."
echo ""
pnpm install

echo ""
echo "✅ Fresh install complete! Project is now in pristine state."
echo ""
echo "📋 Next step:"
echo "   mise run dev    # Start development (auto-runs migrations)"
echo ""
"""

# =============================================================================
# Workspace (git worktree workflow)
# =============================================================================
[tasks.draft]
alias = ["n", "new"]
description = "Create a new feature worktree: mise run draft feat/login [base-branch]"
usage = """
arg "<name>"
arg "[base]" default="main"
"""
run = """
# Normalize branch name for directory: feat/login → feat-login
DIR_NAME=$(echo "$usage_name" | tr '/' '-')
WORKTREE_PATH="../$DIR_NAME"

if [ -d "$WORKTREE_PATH" ]; then
  echo "Worktree already exists: $WORKTREE_PATH"
  exit 1
fi

# Check if branch already exists
if git show-ref --verify --quiet "refs/heads/$usage_name"; then
  echo "Branch '$usage_name' already exists, reusing it..."
  git worktree add "$WORKTREE_PATH" "$usage_name"
else
  echo "Creating worktree from '$usage_base'..."
  git worktree add -b "$usage_name" "$WORKTREE_PATH" "$usage_base"
fi

# Copy secrets file if it exists
if [ -f "templates/jant-site/.dev.vars" ]; then
  cp templates/jant-site/.dev.vars "$WORKTREE_PATH/templates/jant-site/.dev.vars"
  echo "Copied .dev.vars"
fi

# Install dependencies (worktrees don't share node_modules)
echo "Installing dependencies..."
(cd "$WORKTREE_PATH" && pnpm install)

echo ""
echo "Worktree ready: $WORKTREE_PATH"
echo "  cd $WORKTREE_PATH && mise run dev"
"""

[tasks.review]
alias = "rv"
description = "Create a review worktree from a remote branch: mise run review feat/login"
usage = 'arg "<branch>"'
run = """
# Fetch latest from remote
git fetch origin

# Check if remote branch exists
if ! git show-ref --verify --quiet "refs/remotes/origin/$usage_branch"; then
  echo "Remote branch 'origin/$usage_branch' not found."
  echo ""
  echo "Available remote branches:"
  git branch -r --list 'origin/*' | grep -v HEAD | sed 's|origin/||' | sort
  exit 1
fi

DIR_NAME="review-$(echo "$usage_branch" | tr '/' '-')"
WORKTREE_PATH="../$DIR_NAME"

if [ -d "$WORKTREE_PATH" ]; then
  echo "Review worktree already exists: $WORKTREE_PATH"
  exit 1
fi

git worktree add "$WORKTREE_PATH" "origin/$usage_branch"

# Copy secrets file if it exists
if [ -f "templates/jant-site/.dev.vars" ]; then
  cp templates/jant-site/.dev.vars "$WORKTREE_PATH/templates/jant-site/.dev.vars"
  echo "Copied .dev.vars"
fi

# Install dependencies
echo "Installing dependencies..."
(cd "$WORKTREE_PATH" && pnpm install)

echo ""
echo "Review worktree ready: $WORKTREE_PATH"
echo "  cd $WORKTREE_PATH && mise run dev"
"""

[tasks.trash]
alias = "rm"
description = "Remove a worktree directory (keeps branch): mise run trash feat-login"
usage = 'arg "<name>"'
run = """
WORKTREE_PATH="../$usage_name"

# Safety: prevent deleting the main worktree
CURRENT_DIR=$(basename "$(pwd)")
if [ "$usage_name" = "$CURRENT_DIR" ]; then
  echo "Cannot remove the current worktree. Run this from a different worktree."
  exit 1
fi

if [ ! -d "$WORKTREE_PATH" ]; then
  echo "Worktree not found: $WORKTREE_PATH"
  echo ""
  echo "Available worktrees:"
  git worktree list
  exit 1
fi

echo "Removing worktree: $WORKTREE_PATH"
git worktree remove "$WORKTREE_PATH" --force
echo "Done. Branch is still available (use 'git branch -d <name>' to delete it)."
"""

[tasks.wt-list]
alias = "wl"
description = "List all git worktrees"
run = "git worktree list"

[tasks.import]
description = "Move a project from ~/Inbox/ into the workspace: mise run import my-project"
usage = 'arg "<name>"'
run = """
SOURCE="$HOME/Inbox/$usage_name"
DEST="../$usage_name"

if [ ! -d "$SOURCE" ]; then
  echo "Not found: $SOURCE"
  exit 1
fi

if [ -d "$DEST" ]; then
  echo "Already exists: $DEST"
  exit 1
fi

mv "$SOURCE" "$DEST"
echo "Moved: $SOURCE → $DEST"
"""

# =============================================================================
# Examples (generated from templates/jant-site, not committed to git)
# =============================================================================
[tasks.example-new]
alias = "ne"
description = "Create a new example from templates/jant-site"
usage = 'arg "<name>"'
run = """
DEST="examples/$usage_name"

if [ -d "$DEST" ]; then
  echo "Already exists: $DEST"
  exit 1
fi

rsync -a \
  --exclude='node_modules' --exclude='.wrangler' --exclude='.swc' \
  --exclude='.vite' --exclude='dist' --exclude='.dev.vars' \
  --exclude='scripts/' --exclude='wrangler.demo.toml' --exclude='README.md' \
  --exclude='_github' --exclude='_gitignore' --exclude='_env.example' \
  --exclude='pnpm-workspace.yaml' --exclude='.prettierrc' \
  templates/jant-site/ "$DEST/"

sed -i '' "s/\"name\": \"jant-site\"/\"name\": \"example-$usage_name\"/" "$DEST/package.json"
echo 'AUTH_SECRET=example-dev-secret-at-least-32-characters-long' > "$DEST/.dev.vars"
pnpm install

echo ""
echo "Created: $DEST"
echo "Next: edit $DEST/src/index.ts, then mise run example $usage_name"
"""

[tasks.example-seed]
alias = "se"
description = "Seed an example's local database with dev data"
usage = 'arg "<name>"'
run = """
cd "examples/$usage_name"
yes | pnpm exec wrangler d1 migrations apply DB --local
pnpm exec wrangler d1 execute DB --local --file=../../templates/jant-site/scripts/reset-local.sql
pnpm exec wrangler d1 execute DB --local --file=../../templates/jant-site/scripts/seed-local.sql
"""

[tasks.example]
alias = "ex"
description = "Run a script in an example project: mise run example <name> [script]"
usage = """
arg "<name>"
arg "[script]" default="dev"
"""
run = 'pnpm --filter "./examples/$usage_name" "$usage_script"'

# =============================================================================
# Starter Template
# =============================================================================
[tasks.generate-starter]
alias = "gs"
description = "Generate jant-starter template using create-jant CLI (for testing sync-starter workflow)"
run = """
pnpm --filter create-jant prepublishOnly
PROJECT_ROOT=$(pwd)
rm -rf /tmp/my-site
cd /tmp && node "$PROJECT_ROOT/packages/create-jant/dist/index.js" my-site -y --no-install --no-git
rm -f /tmp/my-site/.dev.vars
echo ""
echo "Output: /tmp/my-site"
"""

# =============================================================================
# create-jant CLI
# =============================================================================
[tasks.create-build]
description = "Build create-jant CLI"
run = "pnpm --filter create-jant build"

[tasks.create-dev]
description = "Watch and rebuild create-jant CLI"
run = "pnpm --filter create-jant dev"

[tasks.test-template]
description = "Integration test: scaffold a project with create-jant, then build + typecheck it"
run = """
pnpm --filter @jant/core build:lib
pnpm --filter create-jant prepublishOnly
pnpm --filter create-jant test-template
"""

# =============================================================================
# Release & Publishing (Changesets)
# =============================================================================
[tasks.changeset]
alias = "cs"
description = "Create a new changeset for your changes"
run = "pnpm changeset"

[tasks.changeset-add]
alias = "cs-add"
description = "Create a changeset non-interactively: mise run changeset-add <patch|minor|major> <summary>"
usage = """
arg "<bump>"
arg "<summary>"
"""
run = """
node -e "
const write = require(require.resolve('@changesets/write', { paths: [require.resolve('@changesets/cli')] }));
write.default(
  { summary: process.argv[2], releases: [{ name: '@jant/core', type: process.argv[1] }, { name: 'create-jant', type: process.argv[1] }] },
  process.cwd()
).then(id => console.log('Created changeset:', id));
" "$usage_bump" "$usage_summary"
"""

[tasks.changeset-status]
alias = "cs-status"
description = "Show pending changesets and version bumps"
run = "pnpm changeset status"

[tasks.version]
description = "Apply changesets and bump versions (generates CHANGELOG)"
run = "pnpm changeset version"

[tasks.release]
description = "Build and publish all packages to npm (CI only, requires provenance)"
run = "pnpm release"

[tasks.release-local]
description = "Build and publish all packages locally"
run = """
pnpm --filter @jant/core build:lib
pnpm --filter jant-theme-card build
pnpm --filter jant-theme-minimal build
pnpm --filter jant-theme-threads build
pnpm -r --filter './packages/*' --filter './themes/*' publish --access public --no-provenance --no-git-checks
"""

[tasks.release-dry]
description = "Dry run of release (no actual publish)"
run = "pnpm build && pnpm -r --filter './packages/*' --filter './themes/*' publish --dry-run --no-provenance"

[tasks.publish-core]
description = "Build and publish @jant/core to npm"
run = "pnpm --filter @jant/core build:lib && cd packages/core && npm publish --access public --no-provenance --no-git-checks"

[tasks.publish-create]
description = "Build and publish create-jant to npm"
run = "pnpm --filter create-jant build && cd packages/create-jant && npm publish --access public --no-provenance --no-git-checks"
