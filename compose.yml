services:
  jant-migrate:
    image: ${IMAGE:-owenyoung/jant:latest}
    env_file:
      - .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PORT: ${PORT:-3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TZ: ${TZ:-UTC}
    command: ["jant", "migrate"]
    volumes:
      - ./data:/var/lib/jant
    restart: "no"

  jant:
    image: ${IMAGE:-owenyoung/jant:latest}
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PORT: ${PORT:-3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/var/lib/jant
    depends_on:
      jant-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
